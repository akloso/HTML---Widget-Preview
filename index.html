<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Paste HTML, iframe, form, or JavaScript widget code and open it in a browser preview." />
  <title>HTML & Widget Preview</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page-shell">
    <section class="tool-card" aria-labelledby="page-title">
      <header class="tool-header">
        <p class="brand">Zapora</p>
        <h1 id="page-title">HTML &amp; Widget Preview</h1>
        <p class="intro">Paste your widget or embed code and open it in a new browser preview.</p>
      </header>

      <div class="field-group">
        <label for="mode">Input format</label>
        <select id="mode">
          <option value="combined">Combined Code</option>
          <option value="div-script">DIV + Script</option>
          <option value="button-script">Button + Script</option>
          <option value="iframe">Iframe Only</option>
          <option value="html-css-js">HTML + CSS + JavaScript</option>
        </select>
      </div>

      <div id="editor-area" class="editor-area"></div>

      <div class="actions">
        <button id="run-preview" class="button button-primary" type="button">Run Preview</button>
        <button id="copy-code" class="button" type="button">Copy Code</button>
        <button id="clear-code" class="button" type="button">Clear</button>
        <button id="reset-all" class="button" type="button">Reset</button>
      </div>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
